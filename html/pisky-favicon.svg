<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PiSky">
  <title>PiSky</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a82f4"/>
      <stop offset="1" stop-color="#61d9ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#61d9ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#61d9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Night field -->
  <rect width="64" height="64" rx="15" fill="#0b1020"/>
  <rect width="64" height="64" rx="15" fill="url(#glow)"/>

  <!-- The all-sky dome: a horizon line under a bright arc -->
  <path d="M13 42a19 19 0 0 1 38 0" fill="none" stroke="url(#sky)"
        stroke-width="4.4" stroke-linecap="round"/>
  <path d="M21 42a11 11 0 0 1 22 0" fill="none" stroke="url(#sky)"
        stroke-width="2.6" stroke-linecap="round" opacity=".5"/>
  <line x1="11" y1="47" x2="53" y2="47" stroke="#61d9ff"
        stroke-width="3" stroke-linecap="round" opacity=".75"/>

  <!-- Zenith star -->
  <circle cx="32" cy="21" r="3.6" fill="#f5f7ff"/>
  <circle cx="46" cy="16" r="1.5" fill="#f5f7ff" opacity=".8"/>
  <circle cx="19" cy="18" r="1.2" fill="#f5f7ff" opacity=".6"/>
</svg>
